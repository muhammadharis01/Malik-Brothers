{% load i18n humanize %}

<div id="balance-display-container" class="mt-2 p-5 bg-[#E8F0FB]/80 border border-[#A9C5EE] rounded-xl flex items-center justify-between flex-wrap gap-4">
    <div>
        <span class="block text-xs font-bold uppercase tracking-wider text-[#00235A]">
            {% trans "Balance Receivable" %}
        </span>
        <span class="text-xs text-[#003A8C]">{% trans "Auto-calculated (Total minus Advance)" %}</span>
    </div>
    <div class="text-right">
        <span class="text-2xl sm:text-3xl font-extrabold text-[#001A42] font-mono tracking-tight">
            Rs. {{ balance|floatformat:2|intcomma }}
        </span>
    </div>
    {% if error %}
    <div class="w-full text-sm font-semibold text-rose-600 flex items-center gap-2 pt-2 border-t border-[#A9C5EE]">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>{{ error }}</span>
    </div>
    {% endif %}
</div>
