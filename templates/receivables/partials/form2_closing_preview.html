{% load i18n humanize %}

<div id="form2-closing-preview">
    <label class="text-sm font-semibold text-slate-700">
        {% trans "Closing Balance (Auto-Calculated)" %}
    </label>
    <div class="relative">
        <input type="text" readonly
               value="Rs. {{ closing_balance|floatformat:2|intcomma }}"
               class="w-full h-12 px-4 text-lg font-bold bg-slate-100 text-slate-900 border border-slate-300 rounded-xl cursor-not-allowed select-none shadow-inner font-mono">
        <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
        </div>
    </div>
    {% if error %}
    <p class="text-xs font-semibold text-rose-600 mt-1.5">{{ error }}</p>
    {% elif closing_balance == 0 and has_loaded %}
    <p class="text-xs font-semibold text-emerald-700 mt-1.5">
        {% trans "This collection will settle the builty in full and mark it CLOSED upon delivery." %}
    </p>
    {% endif %}
</div>
