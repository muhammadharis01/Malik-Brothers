<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Unavailable | Malik Brothers</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#F2FBFA,#EEF4FC 60%,#F2FBFA);color:#1e293b}

        a{display:inline-block;padding:.8rem 1.75rem;background:#0047AB;color:#fff;text-decoration:none;font-weight:600;border-radius:.75rem;font-size:.95rem}
        a:hover{background:#003A8C}

</head>

    <div class="card">
        <div class="brand">MALIK BROTHERS</div>
        <span class="badge">Error 500</span>
